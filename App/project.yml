# XcodeGen specification for the Courseleaf iPad app.
# Generate with: cd App && xcodegen generate   (the .xcodeproj is not committed)
name: Courseleaf
options:
  bundleIdPrefix: com.idlery
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
packages:
  CourseleafCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"                     # Swift 5 language mode; strict concurrency warnings only
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "2"              # iPad only at launch
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7GNFT94A9L             # Idlery; must match the signing team in Scripts/export-options.plist
    MARKETING_VERSION: "1.0.0"               # override on the xcodebuild command line for a release
    CURRENT_PROJECT_VERSION: "1"             # build number; the release script picks the next unused one
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Courseleaf:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Courseleaf
        excludes: ["**/*.md"]
    dependencies:
      - package: CourseleafCore
        products: [DocumentCore, PageGeometry, Editing, Persistence, Archive, Catalog, Workspace]
    info:
      path: Courseleaf/Info.plist
      properties:
        CFBundleDisplayName: Courseleaf
        CFBundleName: Courseleaf
        # Without these two, XcodeGen writes its own defaults — a literal "1.0"
        # and "1" — into the generated Info.plist, and the MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION the release passes to xcodebuild are ignored.
        # The build number matching was luck the first time and would have
        # uploaded build 2 as build 1, which App Store Connect rejects.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSCameraUsageDescription: "Courseleaf uses the camera to scan paper pages into your notebook. Scans stay on this iPad."
        NSPhotoLibraryUsageDescription: "Courseleaf can insert photos from your library into a page. Nothing is uploaded."
        NSPhotoLibraryAddUsageDescription: "Courseleaf can save exported page images to your photo library."
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Courseleaf Archive
            LSHandlerRank: Owner
            LSItemContentTypes: [com.idlery.courseleaf.archive]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.idlery.courseleaf.archive
            UTTypeDescription: Courseleaf Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [courseleaf]
              public.mime-type: [application/x-courseleaf-archive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idlery.courseleaf
        # Repeated from the project settings because supportedDestinations: [iOS]
        # above expands to the universal "1,2" on this target, which quietly beat
        # the project-level "2" and built an iPhone-and-iPad app. A target-level
        # value wins, so the shipped app is iPad-only as intended.
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Courseleaf/Courseleaf.entitlements
      properties: {}
  CourseleafUITests:
    # A genuine UI-test target. The app-hosted unit tests can show that the
    # toolbar tells its delegate the right thing; only this can show that the
    # button is on screen, big enough to hit, and reachable at the width the
    # student is using.
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources: [CourseleafUITests]
    dependencies:
      - target: Courseleaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idlery.courseleaf.uitests
        TEST_TARGET_NAME: Courseleaf
        TARGETED_DEVICE_FAMILY: "2"

  CourseleafTests:
    type: bundle.unit-test
    platform: iOS
    # Without explicit destinations the test bundle is not eligible for the
    # iPad simulator destination, and `xcodebuild test` runs zero tests while
    # still exiting 0.
    supportedDestinations: [iOS]
    sources: [CourseleafTests]
    dependencies:
      - target: Courseleaf
      - package: CourseleafCore
        products: [DocumentCore, PageGeometry, Editing, Persistence, Archive, Catalog, Workspace, Fixtures]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idlery.courseleaf.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Courseleaf.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Courseleaf"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Courseleaf:
    build:
      targets:
        Courseleaf: all
        CourseleafTests: [test]
        CourseleafUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CourseleafTests, CourseleafUITests]
      gatherCoverageData: true
    archive:
      config: Release
