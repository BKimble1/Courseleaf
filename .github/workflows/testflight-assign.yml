name: TestFlight assignment

# Put a build that is already uploaded and processed into the internal tester
# group, and add the account's tester when there is exactly one.
#
# These are the last steps of the release workflow, split out so they can be
# retried on their own. They talk only to the App Store Connect API, so they
# need no Xcode, no signing and no macOS runner — which matters when a build
# has been accepted and only the assignment is missing. It builds nothing, so
# it cannot change what was shipped.
#
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString of the processed build"
        required: true
        default: "1.0.0"
      build_number:
        description: "CFBundleVersion of the processed build"
        required: true
        default: "1"

jobs:
  assign:
    name: Internal group and testers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      APP_APPLE_ID: "6811381700"
      TESTFLIGHT_GROUP: "Courseleaf Testing Group"
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Python environment for the App Store Connect API
        run: pip install --quiet "pyjwt[crypto]"

      - name: Install the App Store Connect API key
        env:
          KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_PRIVATE_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Require a processed build
        # Assignment is only meaningful for a build App Store Connect has
        # finished processing; anything else would be assigning a build testers
        # cannot install.
        run: |
          python3 Scripts/asc.py build-state --app-id "$APP_APPLE_ID" \
            --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" | tee "$RUNNER_TEMP/build.json"
          python3 - "$RUNNER_TEMP/build.json" <<'PY'
          import json, sys
          build = json.load(open(sys.argv[1]))
          state = build.get("processingState")
          if state != "VALID":
              raise SystemExit(f"FAIL: build is {state!r}, not VALID")
          print(build["id"])
          PY
          BUILD_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/build.json")
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build $MARKETING_VERSION ($BUILD_NUMBER) is VALID: $BUILD_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add the build to the internal group
        run: |
          python3 Scripts/asc.py add-build --app-id "$APP_APPLE_ID" \
            --name "$TESTFLIGHT_GROUP" --build-id "$BUILD_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Internal testers
        continue-on-error: true
        run: |
          # Reports who is on the group, then adds the account's user only when
          # there is exactly one and it is therefore unambiguous. Ambiguity is a
          # question for a human, not a guess: an invitation cannot be unsent.
          python3 Scripts/asc.py testers --app-id "$APP_APPLE_ID" --name "$TESTFLIGHT_GROUP" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 Scripts/asc.py add-tester --app-id "$APP_APPLE_ID" --name "$TESTFLIGHT_GROUP" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Confirm the group now carries the build
        run: |
          python3 Scripts/asc.py testers --app-id "$APP_APPLE_ID" --name "$TESTFLIGHT_GROUP" \
            | tee "$RUNNER_TEMP/after.json"
          {
            echo "## Install on the iPad"
            echo "1. App Store Connect → Apps → Courseleaf → TestFlight → $MARKETING_VERSION ($BUILD_NUMBER)"
            echo "2. The build is in the **$TESTFLIGHT_GROUP** internal group."
            echo "3. On the iPad, open TestFlight and sign in as a tester on that group."
            echo
            echo "Internal testing only. Nothing here submits the app for App Store review."
          } >> "$GITHUB_STEP_SUMMARY"
