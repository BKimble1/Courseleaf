name: Signing audit

# A read-only inventory of the team's certificates, identifiers, profiles and
# registered devices, used to diagnose release signing without spending a
# macOS build. It creates nothing, changes nothing and revokes nothing, and it
# prints no certificate content, no profile content and no device UDIDs.
#
# Manual dispatch only: this is a diagnostic, not part of a release.

on:
  workflow_dispatch:

jobs:
  audit:
    name: Certificates, identifiers and profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      APP_BUNDLE_ID: com.idlery.courseleaf
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Python environment for the App Store Connect API
        run: pip install --quiet "pyjwt[crypto]"

      - name: Install the App Store Connect API key
        env:
          KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          # Outside the workspace, so no artifact upload can pick it up.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_PRIVATE_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Inventory
        run: |
          python3 Scripts/asc.py audit-signing --bundle-id "$APP_BUNDLE_ID" \
            | tee "$RUNNER_TEMP/audit.json"
          {
            echo "## Signing inventory"
            echo '```json'
            cat "$RUNNER_TEMP/audit.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
