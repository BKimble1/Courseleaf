name: Courseleaf

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: courseleaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core package (Linux, swift test)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev pkg-config
      - name: Toolchain
        run: swift --version && pkg-config --modversion sqlite3
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel 2>&1 | tee test-output.log
      - name: Summary
        if: always()
        run: grep -E "Executed .* tests" test-output.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

  app-ios-simulator:
    name: iPad app (macOS, Xcode, simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"; sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Simulators
        run: xcrun simctl list devices available | grep -i ipad || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core package builds with Xcode toolchain (macOS)
        run: swift build 2>&1 | tail -3
      - name: Build and test on iPad simulator
        run: |
          mkdir -p Build
          Scripts/build-ios.sh
      - name: Test summary
        if: always()
        run: |
          BUNDLE=Build/CourseleafTests.xcresult
          [ -d "$BUNDLE" ] || { echo "no result bundle"; exit 0; }
          # Xcode 26 exposes a stable JSON summary; fall back to the legacy API.
          if xcrun xcresulttool get test-results summary --path "$BUNDLE" --format json > summary.json 2>/dev/null; then
            set -o pipefail
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("summary.json"))
          total = d.get("totalTestCount", "?")
          print("## iPad simulator tests")
          print(f"- result: {d.get('result','?')}")
          print(f"- total: {total}, passed: {d.get('passedTests','?')}, failed: {d.get('failedTests','?')}, "
                f"skipped: {d.get('skippedTests','?')}, expected failures: {d.get('expectedFailures','?')}")
          for dev in d.get("devices", []):
              print(f"- device: {dev.get('deviceName','?')} ({dev.get('platform','?')} {dev.get('osVersion','?')})")
          for f in d.get("testFailures", [])[:20]:
              print(f"  - FAILED {f.get('testName','?')}: {f.get('failureText','')[:200]}")
          # A run that executes nothing must not read as success. This guard exists
          # because a green job once reported totalTestCount 0.
          if not isinstance(total, int) or total == 0:
              raise SystemExit("no tests executed on the simulator; a passing job with zero tests is not evidence")
          PY
          else
            echo "xcresulttool summary unavailable" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- raw summary.json (first 1200 chars) ---"
          head -c 1200 summary.json 2>/dev/null || echo "(none)"
          echo
          echo "--- did xcodebuild actually run tests? ---"
          grep -cE "Test Suite|Test Case|Testing started|testing started" Build/xcodebuild-test.log 2>/dev/null || echo 0
          grep -E "Test Suite '.*' (started|passed|failed)|Executed [0-9]+ test" Build/xcodebuild-test.log 2>/dev/null | head -10 || true
          echo "--- test-bundle / scheme diagnostics ---"
          grep -iE "CourseleafTests.xctest|Test session|no tests|nothing to test|skipping test" Build/xcodebuild-test.log 2>/dev/null | head -10 || true

      - name: Compile error summary
        if: failure()
        run: |
          echo '## iOS build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # xcbeautify strips file/line, so read the raw log the script tees.
          grep -E "error:|error generated|cannot |value of optional|does not conform|Undefined symbol" Build/xcodebuild-test.log 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | sort -u | head -80 >> "$GITHUB_STEP_SUMMARY" || echo "(no error lines matched)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            Build/CourseleafTests.xcresult
            Build/xcodebuild-test.log
          if-no-files-found: ignore
