name: Courseleaf

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: courseleaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core package (Linux, swift test)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev pkg-config
      - name: Toolchain
        run: swift --version && pkg-config --modversion sqlite3
      - name: Build
        run: swift build
      - name: Test
        # `swift test | tee` reports tee's exit code, not the test run's, so this
        # job once printed failing tests and still went green. bash + pipefail
        # makes the pipeline fail with the tests; the xUnit report below is the
        # Linux equivalent of Scripts/check-test-results.sh on the macOS job,
        # because with --parallel a passing run prints no "Executed N tests"
        # line at all — only failures get one — so the log cannot be counted.
        shell: bash
        run: |
          set -o pipefail
          rm -f test-results*.xml
          swift test --parallel --xunit-output test-results.xml 2>&1 | tee test-output.log
      - name: Test verdict
        if: always()
        shell: bash
        run: |
          # Shell, not python3: the swift:6.2-noble image has no python3, and a
          # verdict step that cannot run is a verdict nobody gets.
          shopt -s nullglob
          files=(test-results*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "FAIL: swift test wrote no xUnit report, so nothing is proven" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Sum only the <testsuite> elements; the <testsuites> root would double-count.
          # Each stage tolerates "no match" so the step reports a zero total
          # rather than dying under `set -e` and leaving no verdict at all.
          attrsum() {
            { grep -ho '<testsuite [^>]*>' "${files[@]}" || true; } \
              | { grep -o "$1=\"[0-9]*\"" || true; } \
              | tr -dc '0-9\n' \
              | awk '{ s += $1 } END { print s + 0 }'
          }
          total=$(attrsum tests)
          failures=$(attrsum failures)
          errors=$(attrsum errors)
          {
            echo "## Core package (Linux)"
            echo "- report: ${files[*]}"
            echo "- total: $total, failures: $failures, errors: $errors"
            grep -ho '<failure message="[^"]*"' "${files[@]}" | head -25 | sed 's/^/  - /' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "FAIL: no tests executed; a passing job with zero tests is not evidence" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "FAIL: $failures failure(s), $errors error(s)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK: $total tests executed, 0 failed." | tee -a "$GITHUB_STEP_SUMMARY"

  app-ios-simulator:
    name: iPad app (macOS, Xcode, simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"; sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Simulators
        run: xcrun simctl list devices available | grep -i ipad || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core package builds with Xcode toolchain (macOS)
        run: swift build 2>&1 | tail -3
      - name: Build and test on iPad simulator
        run: |
          mkdir -p Build
          Scripts/build-ios.sh
      - name: Test verdict
        if: always()
        run: |
          Scripts/check-test-results.sh Build/CourseleafTests.xcresult "$GITHUB_STEP_SUMMARY"
          echo "--- did xcodebuild actually run tests? ---"
          grep -E "Test Suite '.*' (started|passed|failed)|Executed [0-9]+ test" Build/xcodebuild-test.log 2>/dev/null | head -10 || true

      - name: Compile error summary
        if: failure()
        run: |
          # Printed to stdout as the last thing in the job so a short log tail
          # always contains it; xcbeautify strips file and line, so read the raw log.
          {
            echo "================ iOS BUILD ERRORS ================"
            grep -E "error:" Build/xcodebuild-test.log 2>/dev/null \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | sed 's#/Users/runner/work/[^/]*/[^/]*/##' \
              | sort -u | head -60 || echo "(no error lines matched)"
            echo "================================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            Build/CourseleafTests.xcresult
            Build/xcodebuild-test.log
          if-no-files-found: ignore
