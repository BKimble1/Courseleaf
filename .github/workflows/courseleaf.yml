name: Courseleaf

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: courseleaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core package (Linux, swift test)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev pkg-config
      - name: Toolchain
        run: swift --version && pkg-config --modversion sqlite3
      - name: Build
        run: swift build
      - name: Test
        # `swift test | tee` reports tee's exit code, not the test run's, so this
        # job once printed failing tests and still went green. bash + pipefail
        # makes the pipeline fail with the tests; the xUnit report below is the
        # Linux equivalent of Scripts/check-test-results.sh on the macOS job,
        # because with --parallel a passing run prints no "Executed N tests"
        # line at all — only failures get one — so the log cannot be counted.
        shell: bash
        run: |
          set -o pipefail
          rm -f test-results*.xml
          swift test --parallel --xunit-output test-results.xml 2>&1 | tee test-output.log
      - name: Test verdict
        if: always()
        shell: bash
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          out = open(sys.argv[1], "a") if len(sys.argv) > 1 else sys.stdout
          def say(line):
              print(line)
              print(line, file=out)
          files = sorted(glob.glob("test-results*.xml"))
          if not files:
              say("FAIL: swift test wrote no xUnit report, so nothing is proven")
              raise SystemExit(1)
          total = failures = errors = 0
          names = []
          for path in files:
              root = ET.parse(path).getroot()
              suites = root.iter("testsuite")
              for suite in suites:
                  total += int(suite.get("tests", 0))
                  failures += int(suite.get("failures", 0))
                  errors += int(suite.get("errors", 0))
              for case in root.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      names.append(f"{case.get('classname','?')}.{case.get('name','?')}: "
                                   f"{(bad.get('message') or '')[:200]}")
          say("## Core package (Linux)")
          say(f"- files: {', '.join(files)}")
          say(f"- total: {total}, failures: {failures}, errors: {errors}")
          for name in names[:25]:
              say(f"  - FAILED {name}")
          if total == 0:
              say("FAIL: no tests executed; a passing job with zero tests is not evidence")
              raise SystemExit(1)
          if failures or errors:
              raise SystemExit(f"FAIL: {failures} failure(s), {errors} error(s)")
          say(f"\nOK: {total} tests executed, 0 failed.")
          PY

  app-ios-simulator:
    name: iPad app (macOS, Xcode, simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"; sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Simulators
        run: xcrun simctl list devices available | grep -i ipad || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core package builds with Xcode toolchain (macOS)
        run: swift build 2>&1 | tail -3
      - name: Build and test on iPad simulator
        run: |
          mkdir -p Build
          Scripts/build-ios.sh
      - name: Test verdict
        if: always()
        run: |
          Scripts/check-test-results.sh Build/CourseleafTests.xcresult "$GITHUB_STEP_SUMMARY"
          echo "--- did xcodebuild actually run tests? ---"
          grep -E "Test Suite '.*' (started|passed|failed)|Executed [0-9]+ test" Build/xcodebuild-test.log 2>/dev/null | head -10 || true

      - name: Compile error summary
        if: failure()
        run: |
          # Printed to stdout as the last thing in the job so a short log tail
          # always contains it; xcbeautify strips file and line, so read the raw log.
          {
            echo "================ iOS BUILD ERRORS ================"
            grep -E "error:" Build/xcodebuild-test.log 2>/dev/null \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | sed 's#/Users/runner/work/[^/]*/[^/]*/##' \
              | sort -u | head -60 || echo "(no error lines matched)"
            echo "================================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            Build/CourseleafTests.xcresult
            Build/xcodebuild-test.log
          if-no-files-found: ignore
